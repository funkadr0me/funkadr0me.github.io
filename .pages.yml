# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Every save in the CMS is a commit to this repo; GitHub Actions then rebuilds the site.

media:
  input: public/images
  output: /images

content:
  - name: settings
    label: Site text
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: label
        label: Label above the headline
        type: string
        required: true
      - name: roles
        label: Typed roles (cycle in the label)
        type: string
        list: { min: 1, max: 6 }
      - name: location
        type: string
      - name: verbs
        label: Headline verbs (the first is the static headline)
        type: string
        list: { min: 1 }
      - name: nouns
        label: Headline nouns (the first is the static headline)
        type: string
        list: { min: 1 }
      - name: headlineTail
        label: Headline second line
        type: string
        required: true
      - name: intro
        label: Hero intro
        type: text
      - name: aboutLabel
        label: About band — small label
        type: string
      - name: about
        label: About band — text
        type: text
      - name: portrait
        label: About band — photo (square, shown in black and white)
        type: image
      - name: portraitAlt
        label: About band — photo description for screen readers
        type: string
      - name: contactHeadline
        label: Contact headline
        type: string
      - name: contactText
        label: Contact text
        type: text
      - name: email
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, client, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        type: string
        required: true
      - name: client
        type: string
      - name: summary
        type: text
      - name: order
        label: Order on the home page (1 = first)
        type: number
      - name: image
        type: image
      - name: imageAlt
        label: Image description (alt text)
        type: string
      - name: thumb
        label: Home page thumbnail (optional; the image is used when empty)
        type: image
      - name: thumbAlt
        label: Thumbnail description (alt text)
        type: string
      - name: tone
        label: Color block (when there's no image)
        type: select
        options:
          values:
            - { name: claret, label: Claret }
            - { name: oxford, label: Oxford }
            - { name: teal, label: Teal }
            - { name: ink, label: Ink }
      - name: blockText
        label: Big text on the color block (optional)
        type: string
      - name: role
        label: Your role (shown at the top of the case study)
        type: string
      - name: cardRole
        label: Short role on the home card, a few words (e.g. UX writing lead)
        type: string
      - name: tags
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: tone
            type: select
            options:
              values:
                - { name: claret, label: Claret }
                - { name: oxford, label: Oxford }
                - { name: teal, label: Teal }
                - { name: ink, label: Ink }
      - name: link
        label: External link (used when there's no case study)
        type: string
      - name: linkLabel
        label: Link text (optional)
        type: string
      - name: secondLink
        label: Second link (optional, e.g. an article about this work)
        type: string
      - name: secondLinkLabel
        label: Second link text
        type: string
      - name: era
        label: Where it sits on the home page
        type: select
        options:
          values:
            - { name: now, label: Home page }
            - { name: earlier, label: Advertising & scriptwriting page }
      - name: draft
        label: Hide from the site
        type: boolean
      - name: body
        label: Case study (leave empty to link out instead)
        type: rich-text
        options:
          format: markdown

  - name: writing
    label: Writing
    type: collection
    path: src/content/writing
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, source, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: source
        label: Where it was published (optional)
        type: string
      - name: date
        type: date
      - name: link
        label: External link (used when there's no text below)
        type: string
      - name: draft
        label: Hide from the site
        type: boolean
      - name: body
        label: Article (leave empty to link out instead)
        type: rich-text
        options:
          format: markdown

  - name: experience
    label: Experience
    type: file
    path: src/content/experience.json
    format: json
    list: true
    fields:
      - name: years
        type: string
      - name: role
        type: string
      - name: org
        label: Organization
        type: string

  - name: awards
    label: Awards
    type: file
    path: src/content/awards.json
    format: json
    list: true
    fields:
      - name: name
        type: string
      - name: detail
        label: Detail (one line per win)
        type: text
      - name: logo
        label: Logo (shown in ink, keep it on a transparent background)
        type: image

  - name: logos
    label: Company logos
    type: file
    path: src/content/logos.json
    format: json
    list: true
    fields:
      - name: name
        label: Company name (exactly as written in Experience)
        type: string
      - name: logo
        label: Logo (black or gray on a transparent background)
        type: image

  - name: resume
    label: Resume
    type: file
    path: src/content/resume.json
    format: json
    fields:
      - name: name
        type: string
      - name: title
        label: Line under the name (current role)
        type: string
      - name: location
        type: string
      - name: summary
        type: text
      - name: experience
        label: Work experience (newest first)
        type: object
        list: true
        fields:
          - name: role
            type: string
          - name: company
            type: string
          - name: location
            type: string
          - name: dates
            label: Dates (e.g. January 2023 - Present)
            type: string
          - name: bullets
            label: What you did (one line each)
            type: string
            list: true
      - name: skills
        type: string
        list: true
      - name: education
        type: object
        list: true
        fields:
          - name: degree
            type: string
          - name: school
            type: string
          - name: dates
            type: string
      - name: certifications
        type: object
        list: true
        fields:
          - name: name
            type: string
          - name: issuer
            type: string
          - name: date
            type: string
      - name: awards
        label: Awards (newest first)
        type: object
        list: true
        fields:
          - name: name
            label: Award or festival
            type: string
          - name: year
            type: string
          - name: detail
            label: What it was for
            type: string
      - name: languages
        type: object
        list: true
        fields:
          - name: name
            type: string
          - name: level
            type: string
